; PlatformIO build (optional second path; Arduino IDE works directly with
; meterkast-proxy.ino) -- same PlatformIO-alongside-Arduino-IDE setup as
; pulsetape's own platformio.ini.
;
;   pio run            build
;   pio run -t upload  flash
;   pio device monitor open serial

[platformio]
; Compile the root sketch plus the layered sources under src/.
src_dir = .

; Shared by every board below -- this sketch is board-agnostic (no GPIOs
; used), so each [env:...] only needs to name its board and (see
; [env:esp32-c6-devkitc-1] below) its platform.
[env]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Injects FIRMWARE_VERSION (git describe --always --dirty --tags) --
; see version.py for why this is a script rather than inline `!` shell
; substitution.
extra_scripts = pre:version.py
lib_deps =
    h2zero/NimBLE-Arduino@^2
    bblanchon/ArduinoJson@^7
    ; Pinned past the 2.0.0 tag -- that release calls WiFiClient::clear(),
    ; which doesn't exist against this project's arduino-esp32 core and
    ; fails to compile; fixed on main (commit 216463d, "use .flush()
    ; instead of clear()") but not yet re-tagged upstream.
    https://github.com/SanteriLindfors/WiFiProvisioner.git#7c78899

; Every env below excludes src/zigbee_scanner.cpp and/or
; src/matter_bridge.cpp (the real implementations, only for
; esp32-c6-devkitc-1-zigbee/-matter respectively) and keeps their
; _stub.cpp counterparts instead -- see the comments at the top of those
; two files for why this is a build_src_filter split rather than a
; preprocessor guard within one file (PlatformIO's Library Dependency
; Finder pulls in a whole library from a bare #include text match,
; regardless of any #ifdef around it).
[env:m5stick-c]
build_src_filter = +<*> -<src/zigbee_scanner.cpp> -<src/matter_bridge.cpp>
; Pinned, not left to resolve "latest" -- pioarduino/platform-espressif32
; (see esp32-c6-devkitc-1 below) republishes itself under the *same*
; "espressif32" platform name to be a drop-in replacement. An unpinned
; `platform = espressif32` here resolved to whichever of the two was
; installed most recently (found live: installing the C6 env's pioarduino
; platform silently made *this* env pick it up too, at 55.3.311, breaking
; the already-verified build). Pinned to the exact official-PlatformIO
; version this env was actually built/flashed/verified against.
platform = espressif32@6.13.0
board = m5stick-c

; Generic no-name ESP32-C6 devkit (CH343 USB-serial bridge, 8MB flash) --
; esp32-c6-devkitc-1 is the closest official board definition (same
; ESP32-C6 chip/flash size), not brand-specific.
;
; This board actually has two separate USB connectors: one wired to the
; CH343 bridge chip (shows up as VID:PID 1A86:55D3, the "generic" COM
; port every env here defaults to targeting), and a second wired
; directly to the C6's own native USB-Serial/JTAG peripheral (shows up
; as VID:PID 303A:1001, Espressif's own vendor ID -- same as the
; Waveshare board below). Confirmed live: flashing the exact same build
; over the native port is ~3.3x faster (1829.6 kbit/s vs ~550-560
; kbit/s over the CH343 one) -- prefer --upload-port on the 303A:1001
; COM port when both are available.
[env:esp32-c6-devkitc-1]
; The official platformio/platform-espressif32 package's board manifest
; only lists "espidf" for every ESP32-C6 board (confirmed still true as of
; its own 7.0.1 release, not just the 6.13.0 pinned above for m5stick-c),
; so `framework = arduino` hard-fails for this board on it ("This board
; doesn't support arduino framework!"). pioarduino/platform-espressif32 is
; the actively-maintained community fork with real, current Arduino-ESP32
; core support for newer chips (C6/S3/C5/P4) -- pinned to an exact release
; for the same reason m5stick-c's pin exists above.
;
; Specifically 55.03.39, not the newer 55.03.311: that release bundles
; arduino-esp32 core 3.3.11, which renamed NimBLE's mempool symbols
; (r_os_memblock_get/put, r_os_mempool_init -> unprefixed) and breaks the
; link against NimBLE-Arduino 2.5.0 (the version this project's lib_deps
; resolves) -- confirmed live and matches an open upstream bug,
; h2zero/NimBLE-Arduino#1174/#1176 (fix written, not yet released as of
; 2026-07-28). 55.03.39 bundles core 3.3.9, still on the old symbol names.
; Revisit once NimBLE-Arduino releases the fix.
;
; Also needs its own isolated PlatformIO core dir -- this platform
; declares itself under the same "espressif32" name as the official one
; m5stick-c uses (by design, as a drop-in replacement), so the two
; silently evict each other's cached framework/toolchain files in the
; default shared ~/.platformio otherwise (confirmed live: building one
; broke the other). Build/upload this env with:
;   PLATFORMIO_CORE_DIR=<separate-path> pio run -e esp32-c6-devkitc-1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
; The board's default partition table isn't derived from its own declared
; 8MB flash size -- it fell back to the same small (1.31MB app partition)
; scheme m5stick-c's smaller flash uses, so this firmware (1.48MB) didn't
; fit ("program size greater than maximum allowed") even though the board
; has plenty of real room. default_8MB.csv is the framework's own
; standard OTA-capable table sized for this board's actual flash.
board_build.partitions = default_8MB.csv
build_src_filter = +<*> -<src/zigbee_scanner.cpp> -<src/matter_bridge.cpp>
; Overrides config.h's DEVICE_HOSTNAME (now #ifndef-guarded there for
; exactly this) -- both boards share one config.h, so without this the C6
; would advertise the same mDNS hostname as m5stick-c and collide on the
; LAN whenever both are powered on at once.
build_flags = ${env.build_flags} -DDEVICE_HOSTNAME='"meterkast-proxy-c6"'

; Same board as esp32-c6-devkitc-1 above, but opted into real Zigbee
; *network* scanning (GET /scan/zigbee -- nearby coordinators/PANs, not
; their member devices; see zigbee_scanner.h) -- kept as a separate env
; rather than folding into the plain one above so building the plain
; board doesn't force the Zigbee-specific partition layout/flag on
; everyone who doesn't want it.
[env:esp32-c6-devkitc-1-zigbee]
platform = ${env:esp32-c6-devkitc-1.platform}
board = esp32-c6-devkitc-1
; Inherits esp32-c6-devkitc-1's own build_flags (std, hostname override)
; and adds the Zigbee library's own required flag on top -- one of these
; two (hard #error in zigbee_scanner.cpp otherwise) -- ZCZR (coordinator/
; router capable) over ED (end-device-only, smaller) since the network
; scan itself runs in ZIGBEE_ROUTER role (see zigbee_scanner.cpp for why).
; Also needs its own dedicated partition table: the stack persists its
; own network state in zb_storage/zb_fct FAT partitions that
; default_8MB.csv (used by the plain env above) doesn't have.
build_flags = ${env:esp32-c6-devkitc-1.build_flags} -DZIGBEE_MODE_ZCZR
board_build.partitions = zigbee_8MB.csv
build_src_filter = +<*> -<src/zigbee_scanner_stub.cpp> -<src/matter_bridge.cpp>

; Same board again, opted into being a real Matter accessory instead (see
; matter_bridge.h) -- a separate env for the same reason the Zigbee one
; is: keeps the plain board build from paying for a feature it isn't
; using.
[env:esp32-c6-devkitc-1-matter]
platform = ${env:esp32-c6-devkitc-1.platform}
board = esp32-c6-devkitc-1
; huge_app.csv is the exact partition scheme pioarduino's own reference
; Arduino+Matter example uses for this board (examples/arduino-matter-light
; in the pioarduino/platform-espressif32 repo) -- unlike Zigbee, no
; special build-time mode flag appears to be needed for Matter; its
; CONFIG_ESP_MATTER_ENABLE_DATA_MODEL sdkconfig gate is apparently already
; enabled in this platform's precompiled core libs.
; POST /matter/commission (matter_bridge.cpp) currently hangs -- a real,
; confirmed structural conflict between NimBLE-Arduino (ble_scanner.cpp)
; and Matter's own BLE transport over the single shared underlying NimBLE
; host, not a fixable timing/coexistence issue -- see the comment on
; matterBridgeStartCommissioning() in matter_bridge.cpp and this project's
; README ("Known real limitations") for the full writeup and the verbose
; (CORE_DEBUG_LEVEL=5) log that pinned it down. Known limitation, left
; as-is; every other endpoint here (endpoint registration, /mija/*,
; /matter/status) works.
build_flags = ${env:esp32-c6-devkitc-1.build_flags}
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<src/zigbee_scanner.cpp> -<src/matter_bridge_stub.cpp>

; A second, physically distinct ESP32-C6 board (Waveshare, native
; USB-Serial/JTAG interface, embedded 8MB flash -- ESP32-C6FH8 QFN32,
; different package than the generic devkit above) running the same
; Matter/thermometer-bridge firmware -- its own env purely so it gets its
; own DEVICE_HOSTNAME. Two physical C6 boards sharing one hostname would
; collide on mDNS if both are ever powered on at once, the same class of
; issue esp32-c6-devkitc-1's own hostname override (above) already
; exists to avoid for m5stick-c. Builds build_flags fresh from the
; shared ${env.build_flags} root (not esp32-c6-devkitc-1's, which already
; bakes in its own -DDEVICE_HOSTNAME) to avoid a macro-redefinition
; warning from two competing -D values for the same name.
[env:esp32-c6-waveshare-matter]
platform = ${env:esp32-c6-devkitc-1.platform}
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DDEVICE_HOSTNAME='"meterkast-proxy-c6-waveshare"'
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<src/zigbee_scanner.cpp> -<src/matter_bridge_stub.cpp>

; A third physical C6 board -- same QFN40/external-flash package as the
; original esp32-c6-devkitc-1 (not the Waveshare's QFN32/embedded-flash
; one). Like the original, it has two USB connectors: a native
; USB-Serial/JTAG port and a CH343 UART bridge port -- but on this
; specific unit the native port (VID:PID 303A:1001) enumerates and
; accepts a flash that verifies successfully, yet the board never
; produces serial output or a network connection afterward. The CH343
; bridge port (VID:PID 1A86:55D3) works correctly -- confirmed live by
; reading its MAC via esptool (matches this board exactly) and then
; flashing/booting successfully over it. Upload via the CH343 port for
; this board; treat the native port as unreliable on this unit rather
; than as a speed optimization. No distinguishing brand name known for
; this one, so named/numbered plainly rather than guessed. Own
; DEVICE_HOSTNAME for the same mDNS-collision reason
; esp32-c6-waveshare-matter's exists.
[env:esp32-c6-devkitc-2-matter]
platform = ${env:esp32-c6-devkitc-1.platform}
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DDEVICE_HOSTNAME='"meterkast-proxy-c6-2"'
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<src/zigbee_scanner.cpp> -<src/matter_bridge_stub.cpp>

; A different chip family entirely -- a Seeed Studio SenseCAP Indicator D1
; (identified from its two USB interfaces: a Seeed-vendor native port,
; VID:PID 2886:0050, that esptool can't reach -- write timeout, likely a
; secondary/debug interface rather than the flashing UART -- and a CH340
; bridge, VID:PID 1A86:7523, that flashes fine; see
; https://www.openhasp.com/0.7.0/hardware/seeed-studio/sensecap-indicator-d1/).
; It's a dual-MCU board (RP2040 + this ESP32-S3) but only the S3 side is
; addressed here -- same plain discovery-proxy firmware as m5stick-c, no
; RP2040/display/sensor code. esptool confirms ESP32-S3 (QFN56), 8MB
; flash, 8MB *embedded octal* PSRAM. The pinned platform release (6.13.0,
; same pin as m5stick-c below) only ships the plain no-PSRAM
; esp32-s3-devkitc-1 board entry -- the PSRAM-variant IDs (n8r8 etc.) were
; added in later platform releases not installed here -- so this starts
; from that plain entry and enables PSRAM manually: -DBOARD_HAS_PSRAM plus
; board_build.arduino.memory_type = qio_opi (quad-I/O flash + octal-I/O
; PSRAM, the standard arduino-esp32 setting for this exact flash/PSRAM
; combination). Official espressif32 platform, same as m5stick-c -- the S3
; has full official Arduino support already, unlike the C6 boards above,
; so it needs neither the pioarduino fork nor its isolated
; PLATFORMIO_CORE_DIR.
[env:esp32-s3-sensecap-indicator]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<src/zigbee_scanner.cpp> -<src/matter_bridge.cpp>
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DDEVICE_HOSTNAME='"meterkast-proxy-s3"'
